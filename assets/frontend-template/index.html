<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e7">
  <title>减脂工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 有机风（默认）：Noto Serif SC + Noto Sans SC + IBM Plex Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <!-- 仪表风：Inter Tight + JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- 杂志风：Playfair Display + Source Serif 4 -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css?v=26">
</head>
<body>
  <!-- 氛围层：纸质噪点 + 两团柔光，营造“餐食记录”的温润质感 -->
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="/" aria-label="减脂工作台首页">
      <span class="brand-mark"><i data-shape="leaf"></i></span>
      <span class="brand-text">
        <b>减脂工作台</b>
        <small>FATLOSS WORKBENCH</small>
      </span>
    </a>
    <div class="top-actions">
      <div class="theme-switch" id="themeSwitch" role="group" aria-label="风格切换">
        <button type="button" data-theme-value="organic" class="active" title="有机（默认）">有机</button>
        <button type="button" data-theme-value="industrial" title="仪表 · 工业深色">仪表</button>
        <button type="button" data-theme-value="editorial" title="杂志 · 衬线编辑">杂志</button>
      </div>
      <span class="access-badge" id="accessBadge">只读</span>
      <span class="save-state" id="saveState" hidden></span>
      <button class="icon-button" id="exportButton" type="button" aria-label="导出数据"><i data-shape="download"></i></button>
      <button class="icon-button" id="importButton" type="button" aria-label="导入数据"><i data-shape="upload"></i></button>
    </div>
  </header>

  <section class="profile-header" id="profileHeader" hidden>
    <div class="profile-header-inner">
      <p class="eyebrow">YOUR FATLOSS PLAN</p>
      <div class="profile-title-row">
        <div class="weight-hero">
          <p class="weight-label" id="weightLabel">当前体重</p>
          <p class="weight-figure">
            <b id="weightNow">—</b>
            <span class="weight-unit">kg</span>
          </p>
          <div class="weight-chips" id="weightChips"></div>
        </div>
        <div class="goal-stamp" aria-hidden="true"><span>DAILY</span><b id="goalKcal">—</b><small>kcal</small></div>
      </div>
      <h1 class="profile-subline" id="profileTitle"></h1>
      <p id="profileMeta"></p>
      <p class="profile-note" id="profileNote"></p>
    </div>
  </section>

  <nav class="module-nav" id="moduleNav" aria-label="工作台模块" hidden>
    <div class="module-nav-inner">
      <button data-tab="today" class="active"><i data-shape="sun"></i><span>今日</span></button>
      <button data-tab="week"><i data-shape="calendar"></i><span>本周</span></button>
      <button data-tab="review"><i data-shape="chart"></i><span>复盘</span></button>
      <button data-tab="mine"><i data-shape="user"></i><span>我的</span></button>
    </div>
  </nav>

  <main id="app" tabindex="-1">
    <section class="state-view" id="loadingView">
      <span class="loading-mark"></span>
      <h1>正在打开减脂工作台</h1>
      <p>读取档案、目标与餐单…</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="dataDialog" aria-labelledby="dataDialogTitle">
    <div class="dialog-head">
      <div><span class="section-kicker">FATLOSSPACK 1.0</span><h2 id="dataDialogTitle">导入与导出数据</h2></div>
      <button class="icon-button" id="dialogClose" type="button" aria-label="关闭">×</button>
    </div>
    <p class="dialog-note">可粘贴 Agent 生成的 FatLossPack JSON，或导出当前数据。</p>
    <div class="dialog-actions">
      <label class="file-button">选择 JSON 文件<input id="importFile" type="file" accept="application/json,.json"></label>
      <button class="text-button" id="formatButton" type="button">格式化</button>
      <button class="text-button" id="downloadButton" type="button">下载当前数据</button>
    </div>
    <textarea id="jsonEditor" spellcheck="false" aria-label="FatLossPack JSON"></textarea>
    <p class="dialog-error" id="dialogError" role="alert"></p>
    <footer class="dialog-footer">
      <button class="text-button" id="dialogCancel" type="button">取消</button>
      <button class="text-button primary-action" id="saveButton" type="button">保存到云端</button>
    </footer>
  </dialog>

  <script src="https://unpkg.com/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script src="/default-pack.js?v=26"></script>
  <script src="/cloud-init.js?v=26"></script>
  <script>
    // 版本自愈探针：托管站点不给 Cache-Control，浏览器会对 index.html 做启发式缓存，
    // 于是出现「代码已发布、页面还是旧版」（历史上就踩过一次：复盘卡上残留了已删除的栏目）。
    // 这里只在**页面加载时**探一次 build.json（带时间戳绕开缓存）：
    // 线上 build 比自己新 → 带 ?b=<新版本> 重开一次，换一个缓存键，用户不必手动强刷。
    // 只用 location.replace，且 sessionStorage 记一次，绝不循环。
    (function () {
      var tag = document.querySelector('script[src*="cloud-init.js"]');
      var m = tag && /[?&]v=(\d+)/.exec(tag.getAttribute("src") || "");
      if (!m) return;
      var BUILD = m[1];
      fetch("/build.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          var online = d && String(d.build || "");
          if (!online || online === BUILD) return;
          var key = "fatloss.build.jump";
          try {
            if (sessionStorage.getItem(key) === online) return; // 已跳过一次，防死循环
            sessionStorage.setItem(key, online);
          } catch (e) { /* 隐私模式下无 sessionStorage：只跳一次也够用 */ }
          location.replace(location.pathname + "?b=" + encodeURIComponent(online));
        })
        .catch(function () { /* 离线或探针失败：保持现状即可 */ });
    })();
  </script>
</body>
</html>
